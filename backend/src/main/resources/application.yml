server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cloudpos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: CloudPOSSecretKey2024VeryLongSecureKeyForJWTTokenGenerationAndValidation
  expiration: 86400000

logging:
  level:
    org.springframework.security: INFO
    com.cloudpos: DEBUG